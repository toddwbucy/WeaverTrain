# REWRITE-CONFIG, REWRITE-TRAIN: Spec 0.2 values for each approved procedure.
[lora]
r = 16
alpha = 32
dropout = 0.0
target_modules = ["q_proj", "k_proj", "v_proj", "o_proj", "in_proj"]

[train]
max_seq_length = 49152
learning_rate = 1e-4
num_train_epochs = 2
per_device_batch_size = 1
gradient_accumulation_steps = 8
warmup_steps = 10
lr_scheduler = "cosine"
seed = 0
gradient_checkpointing = "unsloth"
logging_steps = 1
device_map = "balanced"

[data]
format = "tokenized"
